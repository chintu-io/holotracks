name: Deploy HoloTracks to GitHub Pages

on:
  push:
    branches: [main]
  # GITHUB_TOKEN pushes do not trigger push workflows. The catalogue job dispatches
  # this event only after a changed data/songs.json catalogue is successfully pushed.
  repository_dispatch:
    types: [catalogue-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Validate site scripts
        run: |
          node --check app.js
          node --check scripts/artist-directory.mjs
          node --check tools/update-talent-artwork.mjs
          node --check tools/update-artist-artwork.mjs
          npm test
      - name: Generate official talent artwork manifest
        run: node tools/update-talent-artwork.mjs
      - name: Restore cached channel avatars
        uses: actions/cache@v4
        with:
          path: assets/artist-avatars
          key: holotracks-artist-avatars-${{ runner.os }}-${{ hashFiles('data/songs.json') }}
          restore-keys: |
            holotracks-artist-avatars-${{ runner.os }}-
      - name: Generate artwork for every catalogue artist
        run: node tools/update-artist-artwork.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
