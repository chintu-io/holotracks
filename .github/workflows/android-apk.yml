name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/android-capacitor-apk
    paths:
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.json'
      - 'mobile/**'
      - 'scripts/build-mobile.mjs'
      - 'package.json'
  pull_request:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.json'
      - 'mobile/**'
      - 'scripts/build-mobile.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Run existing project tests
        run: npm test

      - name: Prepare mobile web bundle
        run: npm run mobile:prepare

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor plugins and assets
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: holotracks-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
