name: Refresh Hololive catalogue

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/refresh-catalog.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Incremental (fast) or full reconciliation (all pages)'
        required: true
        default: incremental
        type: choice
        options: [incremental, full]
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: write

concurrency:
  group: holotracks-catalogue-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Determine refresh mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ inputs.mode }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          MODE="incremental"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_MODE" == "full" ]]; then
            MODE="full"
          elif [[ "$EVENT_NAME" == "push" && "$COMMIT_MESSAGE" == *"[full-scan]"* ]]; then
            # Add [full-scan] to an importer/schema-change commit to reconcile all pages.
            # Routine workflow/package edits remain incremental and low-traffic.
            MODE="full"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Selected catalogue refresh mode: $MODE"
      - name: Run automated tests and syntax checks
        run: |
          npm test
          node --check app.js
          node --check scripts/update-catalog.mjs
          node --check scripts/merge-catalogues.mjs
      - name: Refresh catalogue from Holodex
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: node scripts/update-catalog.mjs --mode=${{ steps.mode.outputs.mode }}
      - name: Commit catalogue only when it changed
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- data/songs.json; then
            echo 'Catalogue is unchanged; no commit needed.'
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/songs.json
          git commit -m "chore: refresh Hololive song catalogue"

          # Workflow runs are tied to their triggering commit SHA, so a queued run
          # can start from an older catalogue even if another refresh already pushed.
          # Resolve a data-only conflict by unioning IDs; current main wins for shared IDs.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              mapfile -t conflicted_files < <(git diff --name-only --diff-filter=U)
              if [[ "${#conflicted_files[@]}" -ne 1 || "${conflicted_files[0]}" != "data/songs.json" ]]; then
                echo "Rebase conflicted outside the catalogue file: ${conflicted_files[*]}"
                git rebase --abort || true
                exit 1
              fi

              git show :2:data/songs.json > "$RUNNER_TEMP/catalogue-main.json"
              git show :3:data/songs.json > "$RUNNER_TEMP/catalogue-generated.json"
              git rebase --abort || true
              git reset --hard origin/main
              node scripts/merge-catalogues.mjs \
                "$RUNNER_TEMP/catalogue-main.json" \
                "$RUNNER_TEMP/catalogue-generated.json" \
                data/songs.json

              if git diff --quiet -- data/songs.json; then
                echo 'The concurrent refresh already contains all candidate catalogue changes.'
                echo "changed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git add data/songs.json
              git commit -m "chore: merge Hololive catalogue update after concurrent refresh"
            fi
            if git push origin HEAD:main; then
              echo 'Catalogue update pushed successfully.'
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push raced with another commit (attempt $attempt/3). Retrying after a short delay..."
            sleep $((attempt * 2))
          done
          echo 'Unable to push after three safe attempts.'
          exit 1

      - name: Trigger Pages deployment for changed catalogue
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
            --data '{"event_type":"catalogue-updated"}'
